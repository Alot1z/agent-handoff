name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          # Writes the .npmrc the publish step below authenticates with, reading the token
          # from NODE_AUTH_TOKEN. No token value is ever written into the repository.
          registry-url: 'https://registry.npmjs.org'

      - name: Test suite
        run: node tools/handoff.test.mjs

      # The archive is the release artifact the manual install path documents: extract it
      # and the skill tree is complete, because nothing outside these paths is needed.
      - name: Build archive
        run: |
          mkdir -p dist
          cp -r tools docs refs templates schemas install tests SKILL.md README.md LICENSE package.json skill.json capability-registry.json permission-policy.json handoff.config.schema.json handoff.config.example.json dist/
          cd dist
          zip -r "../agent-handoff-${GITHUB_REF_NAME}.zip" .
          cd ..
          ls -l agent-handoff-${GITHUB_REF_NAME}.zip

      - name: Attach archive to the release
        uses: softprops/action-gh-release@v2
        with:
          files: agent-handoff-${{ github.ref_name }}.zip
          generate_release_notes: true

      # The installer is its own npm package (install/package.json), because it is what a user
      # runs BEFORE the skill exists on their machine: `npx agent-handoff-install`. Only
      # install/ is published — it fetches the skill itself from this repository's tag.
      # Add NPM_TOKEN under Settings → Secrets and variables → Actions to enable this step;
      # without it the step says so and the release still succeeds, so a missing secret cannot
      # turn a good release red. Re-publishing a version npm already has is skipped rather than
      # failed, and a new version means bumping install/package.json in the same commit.
      - name: Publish the installer to npm
        working-directory: install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo 'NPM_TOKEN is not set for this repository — skipping the npm publish.'
            echo 'Add it under Settings → Secrets and variables → Actions to enable this step.'
            exit 0
          fi
          VERSION=$(node -p "require('./package.json').version")
          if npm view "agent-handoff-install@${VERSION}" version >/dev/null 2>&1; then
            echo "agent-handoff-install@${VERSION} is already on npm — nothing to publish."
            exit 0
          fi
          npm publish --access public
          echo "Published agent-handoff-install@${VERSION}"
