name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          # Writes the .npmrc the publish step below authenticates with, reading the token
          # from NODE_AUTH_TOKEN. No token value is ever written into the repository.
          registry-url: 'https://registry.npmjs.org'

      - name: Test suite
        run: node tools/handoff.test.mjs

      # The archive is the release artifact the manual install path documents: extract it
      # and the skill tree is complete, because nothing outside these paths is needed.
      - name: Build archive
        run: |
          mkdir -p dist
          cp -r tools docs refs templates schemas install tests SKILL.md README.md LICENSE package.json skill.json capability-registry.json permission-policy.json handoff.config.schema.json handoff.config.example.json dist/
          cd dist
          zip -r "../agents-handoff-${GITHUB_REF_NAME}.zip" .
          cd ..
          ls -l agents-handoff-${GITHUB_REF_NAME}.zip

      - name: Attach archive to the release
        uses: softprops/action-gh-release@v2
        with:
          files: agents-handoff-${{ github.ref_name }}.zip
          generate_release_notes: true

      # The repository root IS the published package (`agents-handoff` in package.json), and its
      # `files` list carries the skill tree, so `npx agents-handoff` installs without a download.
      # Add NPM_TOKEN under Settings → Secrets and variables → Actions to enable this step;
      # without it the step says so and the release still succeeds, so a missing secret cannot
      # turn a good release red. Re-publishing a version npm already has is skipped rather than
      # failed, and a new version means bumping package.json and SKILL.md in the same commit.
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo 'NPM_TOKEN is not set for this repository — skipping the npm publish.'
            echo 'Add it under Settings → Secrets and variables → Actions to enable this step.'
            exit 0
          fi
          VERSION=$(node -p "require('./package.json').version")
          if npm view "agents-handoff@${VERSION}" version >/dev/null 2>&1; then
            echo "agents-handoff@${VERSION} is already on npm — nothing to publish."
            exit 0
          fi
          npm publish --access public
          echo "Published agents-handoff@${VERSION}"

      # A local build proves the tree is good; it cannot prove what npm SERVES. This step takes
      # the tarball the registry just accepted, unpacks it, and runs the suite that ships inside
      # it — which is the same thing a user gets from `npx agents-handoff`. A published package
      # missing a file, a broken bin path or a suite that only passes in the working copy fails
      # here, on the tag, instead of on a stranger's machine.
      #
      # No token is needed to read a public package, so this runs whether or not NPM_TOKEN is
      # configured; a version that is not on npm (publish skipped) is reported and skipped.
      - name: Verify the published tarball
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          for attempt in $(seq 1 12); do
            npm view "agents-handoff@${VERSION}" dist.tarball >/dev/null 2>&1 && break
            echo "waiting for npm to serve agents-handoff@${VERSION} (attempt ${attempt})..."
            sleep 10
          done
          if ! npm view "agents-handoff@${VERSION}" dist.tarball >/dev/null 2>&1; then
            echo "agents-handoff@${VERSION} is not on npm (no NPM_TOKEN, or the publish was skipped) — nothing to verify."
            exit 0
          fi

          workdir=$(mktemp -d)
          cd "$workdir"
          npm pack "agents-handoff@${VERSION}" >/dev/null
          tar -xzf agents-handoff-*.tgz
          cd package
          echo "--- files in the published tarball ---"
          ls
          echo "--- the published tarball runs its own suite ---"
          node tools/handoff.test.mjs
          echo "--- and the installer ships with it ---"
          node install/install.mjs --help >/dev/null
          echo "agents-handoff@${VERSION} verified from the registry"
